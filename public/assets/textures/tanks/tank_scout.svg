<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
<!-- Scout: light blue, thin, fast -->
<!-- Hull outline -->
<rect x="9" y="9" width="14" height="22" fill="#0C4A6E"/>
<!-- Hull body -->
<rect x="10" y="10" width="12" height="20" fill="#38BDF8"/>
<!-- Hull bottom shading -->
<rect x="10" y="25" width="12" height="5" fill="#0369A1"/>
<!-- Hull top highlight -->
<rect x="11" y="11" width="10" height="2" fill="#7DD3FC"/>
<!-- Left tread -->
<rect x="4" y="6" width="5" height="24" fill="#262626"/>
<rect x="5" y="7" width="3" height="22" fill="#404040"/>
<rect x="5" y="10" width="3" height="2" fill="#6b7280"/>
<rect x="5" y="16" width="3" height="2" fill="#6b7280"/>
<rect x="5" y="22" width="3" height="2" fill="#6b7280"/>
<!-- Right tread -->
<rect x="23" y="6" width="5" height="24" fill="#262626"/>
<rect x="24" y="7" width="3" height="22" fill="#404040"/>
<rect x="24" y="10" width="3" height="2" fill="#6b7280"/>
<rect x="24" y="16" width="3" height="2" fill="#6b7280"/>
<rect x="24" y="22" width="3" height="2" fill="#6b7280"/>
<!-- Turret outline -->
<rect x="12" y="13" width="8" height="9" fill="#0C4A6E"/>
<!-- Turret -->
<rect x="13" y="14" width="6" height="7" fill="#7DD3FC"/>
<rect x="13" y="18" width="6" height="3" fill="#0369A1"/>
<!-- Thin barrel -->
<rect x="15" y="0" width="2" height="14" fill="#082F49"/>
<!-- Muzzle -->
<rect x="14" y="0" width="4" height="2" fill="#082F49"/>
</svg>
