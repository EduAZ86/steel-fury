<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
<!-- Player tank: green with black outline -->
<!-- Outline top -->
<rect x="8" y="0" width="4" height="4" fill="#000"/>
<rect x="12" y="0" width="4" height="4" fill="#000"/>
<rect x="16" y="0" width="4" height="4" fill="#000"/>
<!-- Outline left + body -->
<rect x="4" y="4" width="4" height="4" fill="#000"/>
<rect x="8" y="4" width="4" height="4" fill="#3A8A3E"/>
<rect x="12" y="4" width="4" height="4" fill="#4AA84E"/>
<rect x="16" y="4" width="4" height="4" fill="#4AA84E"/>
<rect x="20" y="4" width="4" height="4" fill="#000"/>
<!-- Outline left + body + outline right -->
<rect x="4" y="8" width="4" height="4" fill="#000"/>
<rect x="8" y="8" width="4" height="4" fill="#3A8A3E"/>
<rect x="12" y="8" width="4" height="4" fill="#4AA84E"/>
<rect x="16" y="8" width="4" height="4" fill="#4AA84E"/>
<rect x="20" y="8" width="4" height="4" fill="#000"/>
<!-- Outline left + body + outline right -->
<rect x="4" y="12" width="4" height="4" fill="#000"/>
<rect x="8" y="12" width="4" height="4" fill="#3A8A3E"/>
<rect x="12" y="12" width="4" height="4" fill="#2E7A32"/>
<rect x="16" y="12" width="4" height="4" fill="#2E7A32"/>
<rect x="20" y="12" width="4" height="4" fill="#000"/>
<!-- Outline left + body + outline right -->
<rect x="4" y="16" width="4" height="4" fill="#000"/>
<rect x="8" y="16" width="4" height="4" fill="#3A8A3E"/>
<rect x="12" y="16" width="4" height="4" fill="#4AA84E"/>
<rect x="16" y="16" width="4" height="4" fill="#4AA84E"/>
<rect x="20" y="16" width="4" height="4" fill="#000"/>
<!-- Outline left + treads + outline right -->
<rect x="4" y="20" width="4" height="4" fill="#000"/>
<rect x="8" y="20" width="4" height="4" fill="#2A5A2E"/>
<rect x="12" y="20" width="4" height="4" fill="#3A8A3E"/>
<rect x="16" y="20" width="4" height="4" fill="#3A8A3E"/>
<rect x="20" y="20" width="4" height="4" fill="#000"/>
<!-- Outline bottom -->
<rect x="4" y="24" width="4" height="4" fill="#000"/>
<rect x="8" y="24" width="4" height="4" fill="#2A5A2E"/>
<rect x="12" y="24" width="4" height="4" fill="#2A5A2E"/>
<rect x="16" y="24" width="4" height="4" fill="#2A5A2E"/>
<rect x="20" y="24" width="4" height="4" fill="#000"/>
<rect x="8" y="28" width="4" height="4" fill="#000"/>
<rect x="12" y="28" width="4" height="4" fill="#000"/>
<rect x="16" y="28" width="4" height="4" fill="#000"/>
</svg>
