<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
<!-- Heavy: purple, big -->
<!-- Hull outline -->
<rect x="5" y="6" width="22" height="25" fill="#3B0764"/>
<!-- Hull body -->
<rect x="6" y="7" width="20" height="23" fill="#A855F7"/>
<!-- Hull bottom shading -->
<rect x="6" y="24" width="20" height="6" fill="#7E22CE"/>
<!-- Hull top highlight -->
<rect x="7" y="8" width="18" height="3" fill="#C084FC"/>
<!-- Left tread -->
<rect x="1" y="4" width="6" height="26" fill="#262626"/>
<rect x="2" y="5" width="4" height="24" fill="#404040"/>
<rect x="2" y="8" width="4" height="2" fill="#6b7280"/>
<rect x="2" y="14" width="4" height="2" fill="#6b7280"/>
<rect x="2" y="20" width="4" height="2" fill="#6b7280"/>
<rect x="2" y="26" width="4" height="2" fill="#6b7280"/>
<!-- Right tread -->
<rect x="25" y="4" width="6" height="26" fill="#262626"/>
<rect x="26" y="5" width="4" height="24" fill="#404040"/>
<rect x="26" y="8" width="4" height="2" fill="#6b7280"/>
<rect x="26" y="14" width="4" height="2" fill="#6b7280"/>
<rect x="26" y="20" width="4" height="2" fill="#6b7280"/>
<rect x="26" y="26" width="4" height="2" fill="#6b7280"/>
<!-- Turret outline -->
<rect x="10" y="11" width="12" height="12" fill="#3B0764"/>
<!-- Turret -->
<rect x="11" y="12" width="10" height="10" fill="#C084FC"/>
<rect x="11" y="19" width="10" height="3" fill="#7E22CE"/>
<!-- Thick barrel -->
<rect x="14" y="0" width="6" height="12" fill="#2E1065"/>
<rect x="14" y="0" width="2" height="12" fill="#7E22CE"/>
<!-- Muzzle brake -->
<rect x="13" y="0" width="8" height="2" fill="#2E1065"/>
</svg>
